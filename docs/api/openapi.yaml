openapi: 3.1.0
info:
  title: ELTARANISI ERP API
  version: 1.1.0
  description: >
    REST API for ELTARANISI ERP (Arabic-first, multi-company double-entry accounting).
    Destructive endpoints (DELETE) additionally require `{"confirm": true}` in the body.
    All monetary values are integer piastres (`*_cents`); quantities are `*_milli`.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: journal
  - name: sales
  - name: purchases
  - name: payables
  - name: reports
  - name: deletions
  - name: system
  - name: debt
paths:
  /api/health:
    get:
      security: []
      summary: Liveness probe
      responses: { "200": { description: OK } }
  /api/auth/login:
    post:
      security: []
      summary: Exchange credentials for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/me:
    get:
      summary: Current user, role and permissions
      responses: { "200": { description: OK } }
  /api/meta:
    get:
      summary: Companies, branches, cost centers, warehouses, fiscal years, roles
      responses: { "200": { description: OK } }
  /api/journal-entries:
    get:
      summary: Paginated journal entries
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, review, approved, posted, reversed] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses: { "200": { description: OK } }
    post:
      summary: Create a draft journal entry
      description: Requires `journal.create`. Rejected when debits != credits (`UNBALANCED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryInput" }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Error" }
  /api/journal-entries/{id}/submit:
    post:
      summary: Submit for review (creator cannot submit own entry)
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Error" } }
  /api/journal-entries/{id}/review:
    post:
      summary: Approve or reject a submitted entry
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string }
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Error" } }
  /api/journal-entries/{id}/post:
    post:
      summary: Post an approved entry to the GL
      description: Requires an open fiscal period; posts exactly once.
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Error" } }
  /api/journal-entries/{id}/reverse:
    post:
      summary: Create a posted mirror entry and freeze the original
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Error" } }
  /api/sales-invoices:
    get: { summary: List sales invoices, responses: { "200": { description: OK } } }
    post:
      summary: Create (and optionally post) a sales invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesInvoiceInput" }
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /api/purchase-invoices:
    get: { summary: List purchase invoices, responses: { "200": { description: OK } } }
    post:
      summary: Create (and optionally post) a purchase invoice
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /api/payments:
    get: { summary: List receipts and payments, responses: { "200": { description: OK } } }
    post:
      summary: Create a receipt/payment with invoice allocations
      responses: { "201": { description: Created }, "422": { $ref: "#/components/responses/Error" } }
  /api/payables:
    get:
      summary: Vendor payables with aging, due schedule and GL reconciliation
      parameters:
        - { in: query, name: as_of, schema: { type: string, format: date } }
      responses: { "200": { description: OK } }
  /api/reports/trial-balance:
    get:
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses: { "200": { description: OK } }
  /api/reports/income-statement:
    get: { summary: Profit and loss for a period, responses: { "200": { description: OK } } }
  /api/reports/balance-sheet:
    get: { summary: Statement of financial position, responses: { "200": { description: OK } } }
  /api/reports/export:
    get:
      summary: CSV export (UTF-8 BOM) — requires `reports.export`
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [trial-balance, income-statement, vendor-payables, aging, journal] } }
      responses:
        "200":
          description: CSV file
          content: { text/csv: { schema: { type: string } } }
  /api/reports/pdf:
    get:
      summary: Financial statement as PDF (Arabic or English) — requires `reports.view`
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [trial-balance, income-statement, balance-sheet, cash-flow, aging, vendor-payables] } }
        - { in: query, name: lang, schema: { type: string, enum: [ar, en], default: ar } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: PDF (Arabic font embedded) , content: { application/pdf: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/reports/xlsx:
    get:
      summary: Financial statement as RTL Excel workbook — requires `reports.export`
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [trial-balance, income-statement, balance-sheet, vendor-payables] } }
      responses:
        "200": { description: XLSX (rightToLeft="1"), content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
  /api/sales-invoices/{id}:
    delete:
      tags: [deletions]
      summary: Delete a sales invoice with its lines, journal entry and stock movements
      description: >-
        Requires the `sales.delete` permission and a body of {"confirm": true}.
        Answers 409 HAS_PAYMENTS while receipts are allocated to the invoice.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a draft sales invoice header (409 ALREADY_POSTED, 422 PERIOD_CLOSED)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `sales.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesInvoicePatchInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/purchase-invoices/{id}:
    delete:
      tags: [deletions]
      summary: Delete a purchase invoice with its lines, journal entry and stock movements
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a draft purchase invoice header (409 ALREADY_POSTED)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `purchases.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInvoicePatchInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/payments/{id}:
    delete:
      tags: [deletions]
      summary: Delete a receipt/payment, release its allocations and restore invoice balances
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a draft receipt/payment
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `payments.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPatchInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/customers/{id}:
    delete:
      tags: [deletions]
      summary: Delete a customer (409 HAS_DOCUMENTS when invoices or receipts reference it)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a customer (409 DUPLICATE on a clashing code)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `customers.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/vendors/{id}:
    get:
      tags: [masters]
      summary: Vendor profile with outstanding balance, invoices and payment history
      description: >
        Feeds the vendor edit panel: the balance is computed from posted and
        partially-paid purchase invoices, and every payment carries its date.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Vendor detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [deletions]
      summary: Delete a vendor (409 HAS_DOCUMENTS when purchase documents reference it)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a vendor (409 DUPLICATE on a clashing code)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `vendors.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/journal-entries/{id}:
    delete:
      tags: [deletions]
      summary: Delete a manual journal entry (system-generated entries answer 409 SYSTEM_ENTRY)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    patch:
      tags: [editing]
      summary: Edit a manual draft journal entry (409 ALREADY_POSTED / SYSTEM_ENTRY)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `journal.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalPatchInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/sales-invoices/{id}/pdf:
    get:
      summary: Tax invoice PDF — requires `sales.view`
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: lang, schema: { type: string, enum: [ar, en], default: ar } }
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/sales-invoices/{id}/xlsx:
    get:
      summary: Tax invoice Excel workbook — requires `sales.view`
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses: { "200": { description: XLSX } }
  /api/sales-invoices/{id}/einvoice:
    get:
      summary: E-invoice readiness document (stable UUID + SHA-256 digest, unsigned) — requires `sales.view`
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Signed readiness payload (persisted in `einvoice_documents`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentUuid: { type: string, example: "87d21250ec43826632a2aee7..." }
                  digest: { type: string, example: "sha256:87d21250..." }
                  readiness: { type: object, properties: { signed: { type: boolean, example: false } } }
  /api/purchase-invoices/{id}/pdf:
    get:
      summary: Purchase invoice PDF — requires `purchases.view`
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: lang, schema: { type: string, enum: [ar, en] } }
      responses: { "200": { description: PDF } }
  /api/purchase-invoices/{id}/xlsx:
    get:
      summary: Purchase invoice Excel workbook — requires `purchases.view`
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses: { "200": { description: XLSX } }
  /api/company:
    get:
      summary: Company profile + invoice defaults (used by PDF/Excel headers)
      responses: { "200": { description: OK } }
    patch:
      summary: Partial update of company identity / invoice defaults — requires `settings.manage`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_ar: { type: string }
                name_en: { type: string }
                tax_number: { type: string }
                phone: { type: string }
                address: { type: string }
                company_email: { type: string }
                company_website: { type: string }
                bank_details: { type: string }
                invoice_terms: { type: string }
                invoice_footer: { type: string }
      responses:
        "200": { description: "Returns { ok, changed[] }" }
        "403": { $ref: "#/components/responses/Error" }
  /api/dev/accounts:
    get:
      security: []
      summary: DEMO ONLY — seeded development logins for one-click sign-in (404 when ERP_SEED_DEMO_DATA=false)
      responses:
        "200":
          description: Demo accounts + warning
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        password: { type: string }
                        role: { type: string }
                        role_name_ar: { type: string }
                        role_name_en: { type: string }
                  demo: { type: boolean }
                  warning: { type: string }
        "404": { description: Demo mode disabled }
  /api/assistant/ask:
    post:
      summary: Scoped financial assistant (read-only, permission-bound, no posting)
      responses: { "200": { description: OK }, "403": { $ref: "#/components/responses/Error" } }
  /api/products/{id}:
    patch:
      tags: [editing]
      summary: Edit a product / service
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `inventory.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/employees/{id}:
    patch:
      tags: [editing]
      summary: Edit an employee and their salary structure
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `payroll.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/bank-accounts/{id}:
    patch:
      tags: [editing]
      summary: Edit a bank or cash box
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `banks.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/bank-transactions/{id}:
    patch:
      tags: [editing]
      summary: Edit an unreconciled bank statement line
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `banks.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/assets/{id}:
    patch:
      tags: [editing]
      summary: Edit a fixed asset (cost/life locked once depreciation started — 409 HAS_DEPRECIATION)
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `assets.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/budgets/{id}:
    patch:
      tags: [editing]
      summary: Edit a budget line
      description: >
        Partial update. Only the fields present in the body change. Requires the
        `budgets.edit` permission (implied by the matching create/manage permission).
        The before/after snapshot is written to the audit trail with the actor and
        timestamp; documents can only be edited while they are still drafts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        409: { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/bank-accounts:
    post:
      tags: [editing]
      summary: Create a bank or cash account
      description: Requires `banks.manage`. The GL account must be a postable asset account of the same company.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountInput" }
      responses:
        "200": { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/bank-transactions/{id}/unreconcile:
    post:
      tags: [banking]
      summary: Undo a bank reconciliation so the matched voucher can be edited or deleted
      description: Requires `banks.manage`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Unreconciled }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/debt/meta:
    get:
      tags: [debt]
      summary: Kinds, billing units, payment methods, cash/bank and expense accounts, vendors
      responses:
        "200": { description: Reference data }
        "403": { $ref: "#/components/responses/Error" }
  /api/debt/accounts:
    get:
      tags: [debt]
      summary: List debt accounts with due / paid / net balances (computed server-side)
      responses:
        "200": { description: Accounts }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [debt]
      summary: Create a debt account (contractor, labour, equipment, transport, fuel, workshop)
      description: Requires `debt.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtAccountInput" }
      responses:
        "200": { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/debt/accounts/{id}:
    get:
      tags: [debt]
      summary: Full statement — account, due lines, settlements and totals
      description: 'totals.net_cents = opening_balance + due − paid.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Statement }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [debt]
      summary: Edit a debt account (name, type, billing unit, opening balance, expense account)
      description: Requires `debt.edit`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/EditResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [debt]
      summary: Delete a debt account
      description: 'Requires `debt.delete` and a body of {"confirm": true}; answers 409 HAS_CHILDREN while dues or settlements exist.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
  /api/debt/accounts/{id}/statement/pdf:
    get:
      tags: [debt]
      summary: Statement PDF (Arabic or English)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: lang, schema: { type: string, enum: [ar, en] } }
      responses:
        "200": { description: PDF }
  /api/debt/accounts/{id}/statement/xlsx:
    get:
      tags: [debt]
      summary: Statement Excel (RTL)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: XLSX }
  /api/debt/items:
    get:
      tags: [debt]
      summary: List due lines (البيان) filtered by account and period
      parameters:
        - { in: query, name: account_id, schema: { type: integer } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Due lines }
    post:
      tags: [debt]
      summary: Add a due line — quantity × unit rate, or an explicit amount
      description: Requires `debt.create`. Posts Dr expense (default 5100) / Cr trade payables (2110).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtItemInput" }
      responses:
        "200": { description: Created }
        "422": { $ref: "#/components/responses/Error" }
  /api/debt/items/{id}:
    patch:
      tags: [debt]
      summary: Edit a due line (a posted line is unposted and re-posted in one transaction)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [debt]
      summary: Delete a due line together with its journal entry
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted }
        "428": { $ref: "#/components/responses/Error" }
  /api/debt/payments:
    get:
      tags: [debt]
      summary: List settlement vouchers (اذن صرف)
      parameters:
        - { in: query, name: account_id, schema: { type: integer } }
      responses:
        "200": { description: Settlements }
    post:
      tags: [debt]
      summary: Add a settlement — posts Dr trade payables / Cr cash or bank
      description: Requires `debt.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtPaymentInput" }
      responses:
        "200": { description: Created }
        "422": { $ref: "#/components/responses/Error" }
  /api/debt/payments/{id}:
    patch:
      tags: [debt]
      summary: Edit a settlement (re-posts the voucher)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [debt]
      summary: Delete a settlement together with its journal entry
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmBody" }
      responses:
        "200": { description: Deleted }
        "428": { $ref: "#/components/responses/Error" }
  /api/debt/summary:
    get:
      tags: [debt]
      summary: Consolidated حساب المديونية — accounts grouped by type with subtotals
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: Summary }
  /api/debt/summary/pdf:
    get:
      tags: [debt]
      summary: Debt summary PDF
      responses:
        "200": { description: PDF }
  /api/debt/summary/xlsx:
    get:
      tags: [debt]
      summary: Debt summary Excel
      responses:
        "200": { description: XLSX }
  /api/debt/invoices:
    get:
      tags: [debt]
      summary: بيان الفواتير — every due line of every contractor in one list
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: account_id, schema: { type: integer } }
      responses:
        "200": { description: Invoice statement rows plus totals }
        "403": { $ref: "#/components/responses/Error" }
  /api/debt/invoices/pdf:
    get:
      tags: [debt]
      summary: Invoice statement PDF
      parameters:
        - { in: query, name: lang, schema: { type: string, enum: [ar, en] } }
      responses:
        "200": { description: PDF }
  /api/debt/invoices/xlsx:
    get:
      tags: [debt]
      summary: Invoice statement Excel (RTL)
      responses:
        "200": { description: XLSX }

components:
  schemas:
    ConfirmBody:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, example: true }
    DeleteResult:
      type: object
      properties:
        ok: { type: boolean, example: true }
        deleted: { type: string, example: sales_invoice }
        id: { type: integer, example: 51 }
        number: { type: string, example: SI-2026-00051 }
    DebtAccountInput:
      type: object
      required: [name_ar]
      properties:
        code: { type: string, example: DB-0016 }
        name_ar: { type: string, example: "ح / عمالة منتصر السيد (بالطن)" }
        name_en: { type: string, example: "Montaser labour (per ton)" }
        kind: { type: string, enum: [contractor, labor, equipment, transport, fuel, workshop, supplies, other] }
        billing_unit: { type: string, enum: [ton, trip, container, hour, month, item] }
        opening_balance: { type: number, example: 0 }
        expense_account_id: { type: integer, example: 45 }
        vendor_id: { type: integer, nullable: true }
        notes: { type: string }
    DebtItemInput:
      type: object
      required: [account_id, description]
      properties:
        account_id: { type: integer, example: 8 }
        doc_date: { type: string, format: date }
        description: { type: string, example: "تفريغ ذرة" }
        operation: { type: string, example: "تفريغ" }
        qty: { type: number, example: 31882.74 }
        unit: { type: string, enum: [ton, trip, container, hour, month, item] }
        unit_rate: { type: number, example: 3 }
        amount: { type: number, description: Optional - computed as qty x unit_rate when omitted }
        vessel: { type: string, example: "GREEN GENIE" }
        client_name: { type: string, example: "ميدسوفت" }
        cargo: { type: string, example: "ذرة" }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        report_no: { type: string, example: "18" }
        post: { type: boolean, default: true }
    DebtPaymentInput:
      type: object
      required: [account_id, amount]
      properties:
        account_id: { type: integer }
        pay_date: { type: string, format: date }
        amount: { type: number, example: 50000 }
        method: { type: string, enum: [cash, bank, cheque, transfer] }
        gl_account_id: { type: integer }
        voucher_no: { type: string, example: "4412" }
        payee: { type: string, example: "أحمد تاج" }
        description: { type: string, example: "دفعة مقدمة لحين استخراج الفاتورة" }
        notes: { type: string }
        post: { type: boolean, default: true }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        full_name_ar: { type: string }
        full_name_en: { type: string }
        role: { type: string }
        permissions: { type: array, items: { type: string } }
    JournalLineInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: integer }
        debit: { type: number, description: Amount in currency units; stored as cents }
        credit: { type: number }
        description: { type: string }
        cost_center_id: { type: integer }
    JournalEntryInput:
      type: object
      required: [entry_date, lines]
      properties:
        entry_date: { type: string, format: date }
        entry_type: { type: string, enum: [manual, opening, adjusting, accrual, depreciation, recurring, fx] }
        memo: { type: string }
        idempotency_key: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLineInput" }
    SalesInvoiceInput:
      type: object
      required: [customer_id, invoice_date, lines]
      properties:
        customer_id: { type: integer }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        warehouse_id: { type: integer, description: Required when any line uses a stocked product }
        post: { type: boolean, default: false }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              qty: { type: number }
              unit_price: { type: number }
              discount: { type: number }
              tax_rate_bp: { type: integer, description: Basis points, 1400 = 14% }

    EditResult:
      type: object
      properties:
        ok: { type: boolean }
        updated: { type: string, example: customer }
        id: { type: integer }
        changed:
          type: array
          items: { type: string }
          example: [name_ar, phone]
    CustomerInput:
      type: object
      properties:
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        phone: { type: string }
        email: { type: string }
        tax_number: { type: string }
        credit_limit: { type: number }
        payment_terms_days: { type: integer }
        is_active: { type: integer, enum: [0, 1] }
        address: { type: string }
    VendorInput:
      type: object
      description: Only code and name_ar are mandatory; an empty name_en falls back to name_ar.
      required: [code, name_ar]
      properties:
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string, description: Optional — defaults to name_ar }
        phone: { type: string }
        email: { type: string }
        tax_number: { type: string }
        payment_terms_days: { type: integer }
        is_active: { type: integer, enum: [0, 1] }
    ProductInput:
      type: object
      properties:
        sku: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        unit: { type: string }
        sale_price: { type: number }
        purchase_price: { type: number }
        reorder_level: { type: number }
        is_active: { type: integer, enum: [0, 1] }
    EmployeeInput:
      type: object
      properties:
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        department: { type: string }
        job_title: { type: string }
        hire_date: { type: string, format: date }
        basic_salary: { type: number }
        allowances: { type: number }
        deductions: { type: number }
        is_active: { type: integer, enum: [0, 1] }
    BankAccountInput:
      type: object
      required: [code, name_ar, name_en, account_type, gl_account_id]
      properties:
        code: { type: string, example: BNK-03 }
        name_ar: { type: string }
        name_en: { type: string }
        account_type: { type: string, enum: [bank, cash] }
        gl_account_id: { type: integer }
        iban: { type: string }
        currency: { type: string, default: EGP }
    BankTransactionInput:
      type: object
      properties:
        txn_date: { type: string, format: date }
        description: { type: string }
        statement_ref: { type: string }
        debit: { type: number }
        credit: { type: number }
    AssetInput:
      type: object
      properties:
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        category: { type: string }
        start_date: { type: string, format: date }
        cost: { type: number }
        useful_life_months: { type: integer }
    BudgetInput:
      type: object
      properties:
        budget: { type: number }
        period_month: { type: integer, minimum: 1, maximum: 12 }
        notes: { type: string }
    JournalPatchInput:
      type: object
      properties:
        entry_date: { type: string, format: date }
        memo: { type: string }
        cost_center_id: { type: integer, nullable: true }
        project_id: { type: integer, nullable: true }
        lines:
          type: array
          description: Full replacement of the entry lines; must balance.
          items: { $ref: "#/components/schemas/JournalLineInput" }
    SalesInvoicePatchInput:
      type: object
      properties:
        customer_id: { type: integer }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        warehouse_id: { type: integer }
        notes: { type: string }
    PurchaseInvoicePatchInput:
      type: object
      properties:
        vendor_id: { type: integer }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        warehouse_id: { type: integer }
        supplier_ref: { type: string }
        po_number: { type: string }
        grn_number: { type: string }
        notes: { type: string }
    PaymentPatchInput:
      type: object
      description: >
        Works for draft and posted vouchers. Posting-relevant changes (date, amount,
        method, gl_account_id) unpost the voucher and post it again in one
        transaction; the audit trail keeps the unpost + repost events.
      properties:
        payment_date: { type: string, format: date }
        amount: { type: number, description: Cannot be lower than the allocated amount }
        method: { type: string, enum: [cash, bank, cheque, transfer] }
        gl_account_id: { type: integer, description: Cash box or bank GL account }
        reference: { type: string }
        notes: { type: string }

    VendorDetail:
      type: object
      properties:
        vendor: { $ref: "#/components/schemas/VendorInput" }
        outstanding_cents: { type: integer, description: Posted + partially-paid invoice remainders }
        paid_total_cents: { type: integer, description: Sum of posted payments to this vendor }
        invoices:
          type: array
          items:
            type: object
            properties:
              invoice_no: { type: string }
              invoice_date: { type: string, format: date }
              due_date: { type: string, format: date }
              total_cents: { type: integer }
              paid_cents: { type: integer }
              remaining_cents: { type: integer }
              status: { type: string }
        open_invoices:
          type: array
          description: Only invoices in status posted / partially_paid
          items: { type: object }
        payments:
          type: array
          items:
            type: object
            properties:
              payment_no: { type: string }
              payment_date: { type: string, format: date }
              amount_cents: { type: integer }
              allocated_cents: { type: integer }
              unallocated_cents: { type: integer }
              method: { type: string }
              reference: { type: string }
              status: { type: string, enum: [draft, posted] }

  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Error:
      description: Uniform error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "UNBALANCED: القيد غير متوازن / Entry is not balanced" }
              details: { type: object }
